name: Deploy to cPanel

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Update cPanel repository
        uses: pinkasey/cpanel-repository-action@v1.0.0
        with:
          hostname: 'https://your-cpanel-hostname.com'
          cpanel_username: 'soundsco'
          cpanel_token: '${{ secrets.CPANEL_TOKEN }}'
          repository_root: '/home/soundsco/repositories/soundscout'
          branch: master
