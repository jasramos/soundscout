version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      - db
    restart: on-failure

  db:
    image: mariadb:10.4.28
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
    volumes:
      - db_data:/var/lib/mysql
      - ./sound_cloud_dump.sql:/docker-entrypoint-initdb.d/sound_cloud_dump.sql

    ports:
      - "3307:3306"

volumes:
  db_data: