        .overlay {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
            width: 100%;
            opacity: 0;
            transition: opacity 0.3s;
            background-color: rgba(0, 0, 0, 0.5); /* Cor e transparência do overlay */
        }

        .img-botao:hover .overlay {
            opacity: 1;
        }

 .img-botao {
            display: block;
            position: relative;
            overflow: hidden;
        }

        .img-botao img {
            transition: transform 0.3s;
        }

        .img-botao:hover img {
            transform: scale(1.1); /* Aumenta a imagem no hover, você pode ajustar conforme desejado */
            opacity: 0.8;
        }
		

        /* Estilos para o texto no overlay */
        .overlay .text {
            color: white;
            font-size: 20px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

		font-size:80px;
		color:white;
		}

		font-size:18px;

    function exibirDescricao(index) {
        // Exibir a descrição da banda e os botes de acesso às redes sociais
        const descricaoBanda = document.querySelector('.descricao-banda');
        descricaoBanda.style.display = 'block';

        const tituloDescricao = document.getElementById('titulo-descricao');
        const descricaoDescricao = document.getElementById('descricao-descricao');
        const imagemDescricao = document.getElementById('imagem-descricao');
        const linkDescricao = document.getElementById('link-descricao');
		const linkSpo = document.getElementById('link-spo');
		const linkYt = document.getElementById('link-yt');

        tituloDescricao.textContent = imagens[index].titulo;
        descricaoDescricao.textContent = imagens[index].descricao;
        imagemDescricao.src = imagens[index].imagem;
        linkDescricao.href = imagens[index].link;
		linkSpo.href = imagens[index].spo;
		linkYt.href = imagens[index].yt;
    }
